<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sájara · Resultados</title><style>:root{--ink:#10243b;--gold:#e6b75d}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f3ed;color:var(--ink)}header{height:70px;background:#071827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 5%;position:sticky;top:0;z-index:5}header img{height:50px;max-width:180px;object-fit:contain}.back{border:0;border-radius:999px;padding:11px 17px;font-weight:800;background:#ffffff18;color:#fff;cursor:pointer}.top{max-width:1250px;margin:0 auto;padding:24px 4%}.summary{background:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 30px #07152212;margin-bottom:18px}.summary h1{margin:0 0 7px;font-size:30px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#eef2f3;border-radius:999px;padding:8px 11px;font-size:13px}.ai{background:#10243b;color:#fff;border-radius:18px;padding:14px 16px;margin-top:14px}.map{height:470px;background:radial-gradient(circle at 50% 35%,#1b5274,#03101b 72%);border-radius:24px;overflow:hidden;position:relative}.map canvas{width:100%;height:100%}.mapTitle{position:absolute;top:14px;left:14px;background:#071827cc;color:#fff;padding:9px 13px;border-radius:99px;font-weight:800}.services{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.service{background:#fff;border:0;border-radius:16px;padding:16px 10px;text-align:center;font-weight:900;color:var(--ink);box-shadow:0 7px 24px #07152210;cursor:pointer}.service span{display:block;font-size:25px;margin-bottom:6px}.service small{font-size:11px;color:#617080;font-weight:700}@media(max-width:700px){.services{grid-template-columns:repeat(2,1fr)}}.listHead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.flights{display:grid;gap:12px}.flight{background:#fff;border-radius:18px;padding:14px;display:grid;grid-template-columns:100px 1fr auto;gap:15px;align-items:center;box-shadow:0 7px 24px #07152210;cursor:pointer}.flight img{width:100px;height:75px;object-fit:cover;border-radius:12px}.route{font-size:17px;font-weight:900}.meta{font-size:13px;color:#617080;margin-top:5px}.price{font-size:24px;font-weight:900}.return{font-size:11px;color:#65717d}.choose{background:var(--gold);border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}.empty{padding:30px;text-align:center;background:#fff;border-radius:18px}@media(max-width:700px){.map{height:390px}.flight{grid-template-columns:75px 1fr}.flight img{width:75px;height:65px}.price{font-size:21px}.choose{grid-column:2}.top{padding:18px 3%}}</style></head><body><header><img id="logo" alt="Sájara"><button class="back" onclick="location.href='sajara_mejorada.html'">← Cambiar búsqueda</button></header><main class="top"><div class="summary"><h1 id="title">Buscando tu viaje…</h1><div class="chips" id="chips"></div><div class="ai" id="ai">🤖 Analizando tus preferencias…</div></div><div class="map"><div class="mapTitle">🌍 Destinos y vuelos disponibles</div><canvas id="canvas"></canvas></div><div class="services"><button class="service" onclick="showService('flights')"><span>✈️</span>Vuelos<small>Mejores precios</small></button><button class="service" onclick="showService('hotels')"><span>🏨</span>Hoteles<small>Mejores ofertas</small></button><button class="service" onclick="showService('cars')"><span>🚗</span>Coches<small>Mejores ofertas</small></button><button class="service" onclick="showService('insurance')"><span>🛡️</span>Seguros<small>Mejores ofertas</small></button><button class="service" onclick="showService('more')"><span>＋</span>Más<small>Otras ofertas</small></button></div><div class="listHead"><h2>Vuelos encontrados</h2><select id="sort" onchange="renderFlights()"><option value="price">Más baratos primero</option><option value="duration">Mejor opción</option></select></div><div class="flights" id="flights"></div></main><script src="https://unpkg.com/globe.gl"></script><script>
const raw=sessionStorage.getItem('sajaraSearch');
const q=raw?JSON.parse(raw):{airport:'SVQ',budget:2000,people:2,journey:'',destination:'',dateText:'',datePrefs:{mode:'any'},mode:'offers'};
const airports={SVQ:'Sevilla',MAD:'Madrid',BCN:'Barcelona',AGP:'Málaga'};let flights=[];
const API_BASE='';
function analyzeDate(t,p){const x=(t||'').toLowerCase();const n=x.match(/(\d+)\s*(?:noches|noche)/);const d=x.match(/(\d+)\s*(?:días|dias|día|dia)/);if(n)return n[1]+' noches';if(d)return d[1]+' días';if(p&&p.mode==='month'&&p.month)return new Date(p.month+'-02').toLocaleDateString('es-ES',{month:'long',year:'numeric'});return 'Fechas flexibles';}
function destinationFilter(){if(!q.destination)return flights;const x=q.destination.toLowerCase();return flights.filter(d=>(d.city+' '+d.country).toLowerCase().includes(x));}
function esc(x){return String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}
function renderFlights(){let a=destinationFilter();if(q.budget!==Infinity)a=a.filter(d=>!d.price||d.price*q.people<=q.budget);a=[...a].sort((x,y)=>document.getElementById('sort').value==='price'?(x.price||99999)-(y.price||99999):Math.abs((x.price||99999)-40)-Math.abs((y.price||99999)-40));document.getElementById('flights').innerHTML=a.map(d=>`<article class="flight"><img src="${esc(d.img||'')}" onerror="this.style.visibility='hidden'"><div><div class="route">${esc(airports[q.airport]||q.airport)} → ${esc(d.city||d.arrival||'Destino')}</div><div class="meta">✈️ Ida y vuelta · ${esc(d.time||'Consultar horarios')} · ${q.people} ${q.people==1?'persona':'personas'} · ${esc(analyzeDate(q.dateText,q.datePrefs))}</div><div class="return">Precio mostrado por persona · ida y vuelta${d.airline?' · '+esc(d.airline):''}</div></div><div><div class="price">${d.price!=null?esc(d.price)+' €':'Consultar'}</div><button class="choose" onclick="event.stopPropagation();window.open('${esc(d.link||'#')}','_blank')">${d.link?'Ver vuelo':'Ver opciones'}</button></div></article>`).join('')||'<div class="empty">No hemos encontrado vuelos con esos filtros. Prueba otras fechas o destino.</div>';drawGlobe(a)}
function drawGlobe(arr){const el=document.getElementById('canvas');el.innerHTML='';const wrap=el.parentElement;const div=document.createElement('div');div.style.cssText='width:100%;height:100%';wrap.appendChild(div);el.style.display='none';const g=Globe()(div,{animateIn:false}).globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg').bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png').backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png').pointLat(d=>d.lat||0).pointLng(d=>d.lng||0).pointColor(d=>'#e6b75d').pointRadius(.55).pointAltitude(.03).pointLabel(d=>`<b>${esc(d.city||'Destino')}</b><br>${d.price!=null?esc(d.price)+' € ida y vuelta':''}`).pointsData(arr);g.controls().autoRotate=false;g.controls().enableDamping=true;}
function showService(type){if(type==='flights'){renderFlights();document.querySelector('.listHead').scrollIntoView({behavior:'smooth'});return}const names={hotels:'Hoteles',cars:'Coches de alquiler',insurance:'Seguros de viaje',more:'Más ofertas'};document.getElementById('flights').innerHTML=`<div class="empty"><h2>Mejores ofertas de ${names[type]}</h2><p>Esta sección queda preparada para conectar un proveedor real. No se ordenará por tus gustos: se buscará por precio/oferta.</p></div>`;document.querySelector('.listHead h2').textContent=names[type];document.querySelector('.listHead').scrollIntoView({behavior:'smooth'});}
async function loadRealFlights(){const box=document.getElementById('flights');box.innerHTML='<div class="empty">🔎 Buscando ofertas reales con SerpApi…</div>';try{const res=await fetch(API_BASE+'/api/flights',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)});const data=await res.json();if(!res.ok)throw new Error(data.error||'Error al buscar');flights=data.flights||[];renderFlights();}catch(e){box.innerHTML=`<div class="empty"><h2>No se pudo conectar con SerpApi</h2><p>${esc(e.message)}</p><p>Comprueba que el servidor de Sájara está iniciado y que SERPAPI_KEY está configurada.</p></div>`;}}
async function init(){document.getElementById('logo').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100"><text x="10" y="65" font-family="Arial" font-size="55" font-weight="700" fill="white">Sájara</text></svg>');const date=analyzeDate(q.dateText,q.datePrefs);document.getElementById('title').textContent=q.destination?`Vuelos a ${q.destination}`:`Vuelos desde ${airports[q.airport]||q.airport}`;document.getElementById('chips').innerHTML=`<span class="chip">📍 ${airports[q.airport]||q.airport}</span><span class="chip">👥 ${q.people} ${q.people==1?'persona':'personas'}</span><span class="chip">💶 ${q.budget===Infinity?'Sin límite':q.budget.toLocaleString('es-ES')+' €'}</span><span class="chip">📅 ${date}</span>`;const tags=[];const text=(q.journey||'').toLowerCase();if(/playa|mar|costa|bañ|nadar/.test(text))tags.push('playa');if(/montaña|naturaleza|lago|sender/.test(text))tags.push('naturaleza');if(/tranquil|poco gente/.test(text))tags.push('tranquilo');document.getElementById('ai').innerHTML=`🤖 <b>Sájara ha analizado tu búsqueda</b><br>${tags.length?'He detectado: '+tags.join(' · ')+'. ':''}${q.journey?'La parte de preferencias se analiza aparte; las ofertas se ordenan por precio y disponibilidad.':'Las ofertas se buscarán por precio y disponibilidad.'}`;await loadRealFlights();}init();</script></body></html>
